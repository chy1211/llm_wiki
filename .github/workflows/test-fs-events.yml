name: Fork test - file_sync event filter

# Fork-only (NOT part of the upstream PR): runs the Rust unit tests of
# commands::file_sync on the three desktop platforms.
on:
  push:
    branches: [ci/test-fs-events]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler
      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc -y
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: fs-events-test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx vite build
      - name: Prepare MCP server resources
        run: |
          npm --prefix mcp-server ci
          npm run mcp:build
      - name: Unit tests (file_sync)
        working-directory: src-tauri
        run: cargo test --lib commands::file_sync -- --test-threads=1
